server:
  address: 127.0.0.1
  port: ${WORKCOVE_SERVER_PORT:8790}

spring:
  application:
    name: workcove
  profiles:
    active: ${WORKCOVE_PROFILE:local}
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/workcove?characterEncoding=UTF-8&connectionTimeZone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.alibaba.druid.pool.DruidDataSource
    username: ${WORKCOVE_DB_USERNAME:workcove_app}
    password: ${WORKCOVE_DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    out-of-order: false
  jackson:
    time-zone: UTC
  mail:
    host: ${WORKCOVE_MAIL_HOST:}
    port: ${WORKCOVE_MAIL_PORT:465}
    username: ${WORKCOVE_MAIL_USERNAME:}
    password: ${WORKCOVE_MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${WORKCOVE_MAIL_AUTH:true}
      mail.smtp.ssl.enable: ${WORKCOVE_MAIL_SSL:true}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

workcove:
  auth:
    cookie-name: workcove_session
    cookie-secure: ${WORKCOVE_AUTH_COOKIE_SECURE:false}
    session-ttl: PT168H
    remembered-session-ttl: PT4320H
    email-code:
      ttl: PT5M
      resend-cooldown: PT60S
      max-per-day: 10

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
