<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f5f7" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/brand/workcove-mark-180.png" />
    <meta
      name="description"
      content="8小时工作台，本地优先的专注工作空间。"
    />
    <title>8小时工作台</title>
    <script>
      ;(function () {
        var dark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
      })()
    </script>
    <style>
      #app-loader {
        position: fixed;
        z-index: 9999;
        inset: 0;
        display: grid;
        overflow: hidden;
        color: rgb(0 0 0 / 88%);
        font-family:
          system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        background: #f5f5f7;
        opacity: 1;
        place-items: center;
      }

      #app-loader.fade-out {
        pointer-events: none;
        animation: workcove-loader-out 420ms cubic-bezier(0.32, 0.72, 0, 1)
          forwards;
      }

      .workcove-loader-content {
        display: flex;
        width: min(360px, calc(100vw - 48px));
        align-items: center;
        text-align: center;
        flex-direction: column;
      }

      .workcove-loader-mark {
        display: grid;
        width: 62px;
        height: 62px;
        overflow: hidden;
        background: #ffffff;
        border-radius: 16px;
        box-shadow:
          0 0 0 0.5px rgb(0 0 0 / 8%),
          0 12px 34px rgb(16 32 48 / 14%);
        place-items: center;
        animation: workcove-loader-rise 560ms
          cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .workcove-loader-mark img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .workcove-loader-name {
        margin-top: 20px;
        font-size: 20px;
        font-weight: 600;
        letter-spacing: 0;
        line-height: 1.2;
        animation: workcove-loader-rise 620ms 80ms
          cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .workcove-loader-slogan {
        min-height: 22px;
        margin-top: 9px;
        color: rgb(0 0 0 / 48%);
        font-size: 13px;
        font-weight: 400;
        line-height: 1.7;
        animation: workcove-loader-rise 660ms 150ms
          cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .workcove-loader-progress {
        position: relative;
        width: 84px;
        height: 2px;
        margin-top: 25px;
        overflow: hidden;
        background: rgb(0 0 0 / 8%);
        border-radius: 999px;
        animation: workcove-loader-rise 680ms 220ms
          cubic-bezier(0.2, 0.75, 0.25, 1) both;
      }

      .workcove-loader-progress::after {
        position: absolute;
        width: 34%;
        content: "";
        background: #007aff;
        border-radius: inherit;
        inset-block: 0;
        animation: workcove-loader-progress 1.25s ease-in-out infinite;
      }

      .workcove-loader-status {
        min-height: 16px;
        margin-top: 10px;
        color: rgb(0 0 0 / 34%);
        font-size: 11px;
        line-height: 16px;
      }

      html[data-theme="dark"] #app-loader {
        color: rgb(255 255 255 / 90%);
        background: #1e1e1e;
      }

      html[data-theme="dark"] .workcove-loader-mark {
        background: #ffffff;
        box-shadow:
          0 0 0 0.5px rgb(255 255 255 / 12%),
          0 14px 36px rgb(0 0 0 / 48%);
      }

      html[data-theme="dark"] .workcove-loader-slogan {
        color: rgb(255 255 255 / 52%);
      }

      html[data-theme="dark"] .workcove-loader-progress {
        background: rgb(255 255 255 / 10%);
      }

      html[data-theme="dark"] .workcove-loader-progress::after {
        background: #0a84ff;
      }

      html[data-theme="dark"] .workcove-loader-status {
        color: rgb(255 255 255 / 34%);
      }

      @keyframes workcove-loader-out {
        from {
          opacity: 1;
          transform: scale(1);
        }

        to {
          opacity: 0;
          transform: scale(1.01);
        }
      }

      @keyframes workcove-loader-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes workcove-loader-progress {
        from {
          transform: translateX(-105%);
        }

        to {
          transform: translateX(300%);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #app-loader.fade-out,
        .workcove-loader-mark,
        .workcove-loader-name,
        .workcove-loader-slogan,
        .workcove-loader-progress,
        .workcove-loader-progress::after {
          animation-duration: 1ms;
          animation-iteration-count: 1;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="app-loader"
      role="status"
      aria-live="polite"
      aria-label="8小时工作台正在启动"
    >
      <div class="workcove-loader-content">
        <div class="workcove-loader-mark" aria-hidden="true">
          <img src="/brand/workcove-mark-180.png" alt="" />
        </div>
        <div class="workcove-loader-name">8小时工作台</div>
        <div id="app-loader-slogan" class="workcove-loader-slogan"></div>
        <div class="workcove-loader-progress" aria-hidden="true"></div>
        <div id="app-loader-status" class="workcove-loader-status">
          正在准备工作台
        </div>
      </div>
    </div>
    <div id="app"></div>
    <script>
      ;(function () {
        var slogans = [
          '把工作，放回自己的节奏。',
          '专注当下，也照顾好自己。',
          '今天的事，一件件做好。',
          '让工具安静地配合你。',
          '留一点空间，给真正重要的事。',
        ]
        var sloganNode = document.getElementById('app-loader-slogan')
        var statusNode = document.getElementById('app-loader-status')
        var loader = document.getElementById('app-loader')
        var next = Math.floor(Math.random() * slogans.length)
        sloganNode.textContent = slogans[next]

        var startedAt = performance.now()
        var minimumVisible = 900
        var pageLoaded = document.readyState === 'complete'
        var appReady = false
        var hiding = false

        function hideLoader() {
          if (hiding) return
          hiding = true
          loader.classList.add('fade-out')
          window.setTimeout(function () {
            loader.remove()
          }, 440)
        }

        function hideWhenReady() {
          if (!pageLoaded || !appReady || hiding) return
          var remaining = Math.max(
            0,
            minimumVisible - (performance.now() - startedAt),
          )
          window.setTimeout(hideLoader, remaining)
        }

        window.addEventListener('load', function () {
          pageLoaded = true
          hideWhenReady()
        })
        window.addEventListener('workcove:app-ready', function () {
          appReady = true
          hideWhenReady()
        })
        window.addEventListener('workcove:startup-status', function (event) {
          if (statusNode && event.detail) statusNode.textContent = event.detail
        })

        window.setTimeout(function () {
          pageLoaded = true
          appReady = true
          hideWhenReady()
        }, 25000)

        hideWhenReady()
      })()
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
