<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ecebe7" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/brand/workcove-mark-1024.png" />
    <meta
      name="description"
      content="WorkCove 栖作，本地优先的个人工作台。"
    />
    <title>WorkCove 栖作</title>
    <script>
      (() => {
        const preference =
          window.localStorage.getItem('workcove.theme') || 'light'
        const systemDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        const resolvedTheme =
          preference === 'dark' ||
          (preference === 'system' && systemDark)
            ? 'dark'
            : 'light'

        document.documentElement.dataset.theme = resolvedTheme
        document.documentElement.style.colorScheme = resolvedTheme
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
